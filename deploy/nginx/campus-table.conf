# /etc/nginx/conf.d/campus-table.conf
# ALB에서 HTTPS를 종료한다. ACG로 이 포트는 ALB 서브넷에서만 접근 허용한다.
# http 컨텍스트에서 include해야 한다.
map $http_x_forwarded_proto $campus_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name www.campus-table.kro.kr campus-table.kro.kr;
    root /var/www/campus-table;
    index index.html;
    client_max_body_size 3m;

    location /api/ {
        # 끝에 /를 붙이지 않는다: 원래 /api/... 경로 유지
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $campus_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        # CLOVA 백엔드 타임아웃(60초)보다 길게 설정
        proxy_read_timeout 90s;
    }

    location = /test-charge.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $campus_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
