spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: campus_table
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # ponytail: ERD 확정 후 validate + Flyway로 전환
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: 30m
    data:
      redis:
        repository-type: indexed # 사용자별 세션 조회(비밀번호 변경 시 다른 기기 로그아웃)에 필요

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  clova:
    api-key: ${CLOVA_API_KEY:}
    endpoint: ${CLOVA_ENDPOINT:https://clovastudio.stream.ntruss.com/v3/chat-completions/HCX-005}
    timeout-seconds: ${CLOVA_TIMEOUT_SECONDS:60}
  occupancy:
    snapshot-max-age-seconds: ${OCCUPANCY_SNAPSHOT_MAX_AGE_SECONDS:300}
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
    region: ${OBJECT_STORAGE_REGION:kr-standard}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    public-base-url: ${OBJECT_STORAGE_PUBLIC_BASE_URL:}
  school-email-domain: ${SCHOOL_EMAIL_DOMAIN:dankook.ac.kr}
  mail-enabled: ${MAIL_ENABLED:true}
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  admin:
    student-number: ${ADMIN_STUDENT_NUMBER:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
