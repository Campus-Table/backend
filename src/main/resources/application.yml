spring:
  application:
    name: campus_table
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # ponytail: ERD 확정 후 validate + Flyway로 전환
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: 30m

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
